[package]
name = "zex-tv"
version = "0.1.0"
description = "ZEX 影视库电视版"
authors = ["ZEX Developer"]
edition = "2021"

[lib]
name = "zex_tv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
